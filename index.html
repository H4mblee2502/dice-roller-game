<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Dice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="diceContent">
        <h2>🎲 Dice Roller 🎲</h2>
        <h2 id="resultWinner">Press Roll!</h2>
        
        <div class="playersContainer">
            <div class="player">
                <h4 id="player1">Player 1</h4>
                <img src="diceImg/1.png" alt="Dice 1" id="player1Img">
            </div>
            <div class="player">
                <h4 id="player2">Banker</h4>
                <img src="diceImg/2.png" alt="Dice 2" id="player2Img">
            </div>
        </div>

        <button onclick="rollDice()">Roll Dice</button>
    </div>

    <script src="diceProgram.js"></script>
</body>
</html>
