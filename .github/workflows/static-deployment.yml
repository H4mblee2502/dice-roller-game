# ==============================================================================
# 🎲 CUSTOM DICE ROLLER GAME — GITHUB ACTIONS CI/CD WORKFLOW
# ==============================================================================
# This configuration automates the testing, linting, and deployment of the
# Custom Dice Roller web application to GitHub Pages whenever changes are 
# pushed to the repository.
# ==============================================================================

name: Deploy Dice Game to GitHub Pages

on:
  # Triggers the workflow on push events targeting the default branch
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent race conditions during updates
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Code Quality Check (Linting & Validation)
  # ----------------------------------------------------------------------------
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML structure
        run: |
          echo "Running HTML structural integrity checks..."
          if [ ! -f index.html ]; then
            echo "Error: index.html is missing from the root directory!"
            exit 1
          fi
          echo "HTML root validation passed successfully."

      - name: Check JavaScript syntax
        run: |
          echo "Parsing diceProgram.js for compilation and syntax errors..."
          # Uses Node's internal engine to check syntax without execution
          node --check diceProgram.js
          echo "JavaScript syntax validation passed successfully."

  # ----------------------------------------------------------------------------
  # JOB 2: Build and Deploy to GitHub Pages
  # ----------------------------------------------------------------------------
  deploy:
    needs: quality-check # Runs only if the quality check passes perfectly
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v4

      - name: Upload static web assets as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository contents (index.html, style.css, JS, images)
          path: '.'

      - name: Deploy static assets live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4